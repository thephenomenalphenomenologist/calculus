<script type='text/javascript'>

	let pageURL = window.location.href;
	let encodedURL = encodeURIComponent(pageURL);
	var pageTitle = "Open Cloze Activity"
    let text = "";
    let words = [];
    let groups = [];

	function loadWebContent() {
		rawText = decodeURI('E4qW Bw ISseR XEm uJZ f0H1 ChDfCd2Hp kq cQm lpRO 6oMXvc1 SythjK VF A 3dCwBZ2N, v5 RQV 8JHSu18ryx DKaG3Ptc; pwOYp9DnWUTR oL 1U qB9iI. XK NrROm ur 6mx9J kGx9 UtYE kd UFUx9eU, by wbZb pYAXScpm UDzxXFqJ EGbGQ 1oS5S LHC 0yCsim1Pp T8Bw0 THQ QyOlJ8bqS9 wC 0qSs o2 BK3ROV2XO.')	
		rawText = rawText.replace(/%25/g,"%"); // replace UTF8 with %
		rawText = rawText.replace(/%23/g,"#"); // replace UTF8 with hashtag
		rawText = rawText.replace(/%26/g,"&"); // replace UTF8 with ampersand
		rawText = rawText.replace(/%27/g,"'"); // replace UTF8 with single quote
		rawText = rawText.replace(/%2B/g,"+"); // replace + with UTF8
		text = decrypt(rawText);
        prepContent();
		}

    function prepContent() {
    
    	if ("Cloze Activity" != "") { pageTitle = decode("Cloze Activity") }

        docTitle = "Flippity.net: " + pageTitle
        encodedDocTitle = encodeURIComponent(docTitle)    
        text = text.split(" ");

        let numsVis = false; // don't display numbers

        for (var i=0; i<text.length; i++) {
            //let dashed = text[i].replace(/[^!@#$%^&*();':",./?]/g, "_");
            let length = text[i].length;
            words[i] = {};
            words[i].id = i;
            words[i].word = text[i];
            words[i].dashed = text[i].replace(/[^!@#$%^&*();':",./?¡¿]/g, "_");
            words[i].length = text[i].length;
            words[i].hidden = 1;
            }

        // Sort words alphabetically
        words.sort(function(a, b) {
            var textA = a.word.toUpperCase();
            var textB = b.word.toUpperCase();
            return (textA < textB) ? -1 : (textA > textB) ? 1 : 0;
            });

        // Sort by length in ascending order
        words.sort((a, b) => a.length - b.length);

        // Put words into 5 groups based on length
        let g = 0;
        let step = words.length/5;
        for (var i=0; i<words.length; i++) {
            groups[g] = [];
            while (i < step*g) {
                groups[g].push(words[i].id);
                i++;
                }
            i--;
            g++;
            }

        // Sort by id in ascending order (put back into correct order)
        words.sort((a, b) => a.id - b.id);

        let code = "";
        for (var i=0; i<words.length; i++) {
            let nm = 1 + i;
            code += "<nobr><span class='num'>" + nm + "</span><div class='word' id='" + i + "' onclick='showHideWord(this)' title='Click to show/hide'>" + words[i].dashed + "</div></nobr> ";
            }
            
        document.getElementById("text").innerHTML = code;
        fillBank();
        }
        
    function showHideWord(el) {
        let id = el.id;
        if (words[id].hidden) {
            document.getElementById(id).innerHTML = words[id].word;
            document.getElementById(id).style.animation = 'zoom 0.25s';
            setTimeout( () => { document.getElementById(id).style.animation = 'none';},250);
            }
        else {
            document.getElementById(id).innerHTML = words[id].dashed;
            }
        words[id].hidden = !words[id].hidden;
        fillBank();
        }

    let boxes = document.getElementsByClassName("word");

    g=0; // initial state
    function showLess() {
        if (g > 0) {
            for (var i=0; i<groups[g].length; i++) {
                let id = groups[g][i];
                boxes[id].innerHTML = words[id].dashed;
                words[id].hidden = 1;
                }
            g--;  
            }
        fillBank();
        }

    function showMore() {
        if (g < 5) {
            g++;
            for (var i=0; i<groups[g].length; i++) {
                let id = groups[g][i];
                boxes[id].innerHTML = words[id].word;
                words[id].hidden = 0;
                }
            }
        fillBank();
        }

    function showAll() {
        g=5;
        for (var i=0; i<boxes.length; i++) {
            boxes[i].innerHTML = words[i].word;
            words[i].hidden = 0;
            }
        fillBank();
        }

    function hideAll() {
        g=0;
        let bank = [];
        for (var i=0; i<boxes.length; i++) {
            boxes[i].innerHTML = words[i].dashed;
            words[i].hidden = 1;
            bank.push(words[i].word.replace(/[!@#$%^&*();':",./?¡¿]/g,""));
            }
        fillBank();
        }

    function fillBank() {
        let bank = [];
        for (var i=0; i<boxes.length; i++) {
            if (words[i].hidden == 1) {
                bank.push("<div class='bankWord'>" + words[i].word.replace(/[!@#$%^&*();':",./?¡¿]/g,"") + "</div>");
                }
            }
        // Sort words alphabetically
        bank.sort(function(a, b) {
            var textA = a.toUpperCase();
            var textB = b.toUpperCase();
            return (textA < textB) ? -1 : (textA > textB) ? 1 : 0;
            });
        if (bank.length > 0) {
            document.getElementById("wordBank").innerHTML = bank.join("");
            }
        else {
            document.getElementById("wordBank").innerHTML = "<div class='bankWord'>---</div>";
            }
        }

    let showNums = false;
    let nms = document.getElementsByClassName("num");
    
    function showHideNums() {
        if (showNums) {
            for (var i=0; i<nms.length; i++) {
                nms[i].style.display = "none";
                }
            }
        else {
            for (var i=0; i<nms.length; i++) {
                nms[i].style.display = "inline-block";
                }
            }
        showNums = !showNums;
        }

    function hideNums() {
            for (var i=0; i<nms.length; i++) {
            nms[i].style.display = "none";
            }
        }

    let gameMode = false;
    function showHideGame() {
        if (gameMode) {
            document.getElementById("gameCol").style.display = "none";
            }
        else {
            document.getElementById("gameCol").style.display = "table-cell";
            document.getElementById("guess").value = "";
            document.getElementById("guess").focus();
            guessed = [];
            document.getElementById("list").innerHTML = "";
            hideAll();
            }
        gameMode = !gameMode;
        }


    let wordBankMode = false;
    function showHideWordBank() {
        if (wordBankMode) {
            document.getElementById("wordBank").style.display = "none";
            }
        else {
            document.getElementById("wordBank").style.display = "block";
            }
        wordBankMode = !wordBankMode;
        }

    let score = 0;
    let guessed = [];
    let correctNums = [];
	var bell = new Audio("Bell.mp3");
	var buzz = new Audio("Buzzer.mp3")
    let wrd = "";
    
    function checkWord() {
        //wrd = document.getElementById("guess").value.trim().replace(/[^a-zA-Z0-9]/g,"");
        wrd = document.getElementById("guess").value.trim();
        if (wrd != "") { // not empty
            if (guessed.includes(wrd)) { // already guessed
                document.getElementById("list").style.animation = "shake 0.25s";
                setTimeout( () => { 
                    document.getElementById("list").style.animation = "none";
                    document.getElementById("guess").value = "";
                    document.getElementById("guess").focus();
                    },500);
                }
            else { // new word
                guessed.push(wrd);
                score = 0;
                correctNums = [];
                for (var i=0; i<words.length; i++) {
                    //if (wrd.toUpperCase() == words[i].word.toUpperCase().replace(/[^a-zA-Z0-9]/g,"")) {
                    if (wrd.toUpperCase() == words[i].word.toUpperCase().replace(/[!@#$%^&*();':",./?¡¿]/g,"")) {
                        correctNums.push(i);
                        words[i].hidden = 0;
                        score++;
                        }
                    }
                // Reveal correct words
                let nm = 0;
                if (score > 0) { // if there are words to reveal
                    bell.play();
                    boxes[correctNums[nm]].innerHTML = words[correctNums[nm]].word;
                    boxes[correctNums[nm]].style.animation = 'zoom 0.25s';
                    fillBank();
                    nm++;
                    if (correctNums.length > 1) { // there are still more words to reveal
                        let interval = setInterval( () => {
                            bell.pause();
                            bell.currentTime = 0;
                            bell.play();
                            boxes[correctNums[nm]].innerHTML = words[correctNums[nm]].word;
                            boxes[correctNums[nm]].style.animation = 'zoom 0.25s';
                            nm++;
                            if (nm == correctNums.length) {
                                clearInterval(interval);
                                setTimeout(endCheck,1000);
                                }
                            },1000);
                        }
                    else {
                        setTimeout(endCheck,1000); // for if there is only one word to reveal
                        }
                    }
                else { // no words to reveal
                    buzz.play();
                    endCheck();
                    }
                }
            }
        }

    function endCheck() {
        if (score > 0) {
            clr = "#000";
            }
        else {
            clr = "#f00";
            }
        let code = "<div class='guess' style='color: " + clr + ";'>" + wrd + " (" + score + ")</div>"
        code += document.getElementById("list").innerHTML;
        document.getElementById("list").innerHTML = code;
        document.getElementById("guess").value = "";
        document.getElementById("guess").focus();
        }

</script>
